name: deploy

on:
  push:
    branches: [main]
    # paths-ignore deliberately does NOT list scripts/ (the deploy is how
    # tooling reaches the droplet) or anything test-shaped (paths-ignore skips
    # the WHOLE workflow including tests, silencing the gate on exactly the
    # commits that move it).
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"

concurrency:
  group: deploy-rain-sg
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Pinned exactly, not to a moving alias. This app is the only one of the
      # six for which the runner is part of the RUNTIME: the other five deploy
      # by SSH and the runner is just an SSH client, but we build the artifact
      # here and rsync it. So the builder must match the droplet in Node ABI,
      # CPU architecture and libc. `ubuntu-latest` is a moving alias, and the
      # symptom of it moving is a green deploy and a service that dies on first
      # use. No native modules today makes this cheap insurance rather than
      # urgent - but it is two lines now and a migration later.
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: node scripts/sanity.mjs
      - run: npm run build

      # Next does not copy .next/static or public into the standalone bundle,
      # and the model is not traced either. Do it here, then verify.
      - name: Assemble standalone bundle
        run: |
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi
          mkdir -p .next/standalone/src/model
          cp src/model/model.json .next/standalone/src/model/model.json
          ASSET=$(find .next/standalone/.next/static -type f | head -1)
          [ -n "$ASSET" ] || { echo "no static output - refusing to ship"; exit 1; }
          [ -f .next/standalone/src/model/model.json ] || { echo "model missing"; exit 1; }

      - name: Ship it
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          port: ${{ secrets.DROPLET_PORT }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: ".next/standalone/**,scripts/**,package.json"
          target: ${{ secrets.DROPLET_APP_DIR }}
          overwrite: true

      - name: Restart and verify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          port: ${{ secrets.DROPLET_PORT }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          command_timeout: 20m
          script: |
            cd ${{ secrets.DROPLET_APP_DIR }}
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh
